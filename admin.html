
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Kapoor Home Care</title>
  <style>
    :root {
      --navy: #082954;
      --red: #d91c24;
      --green: #1ea857;
      --bg: #f4f7fb;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: #1b2a4a;
    }
    .topbar {
      background: var(--navy);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand-link {
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .mode-switch {
      display: inline-flex;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .mode-btn {
      color: #fff;
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .mode-btn.active { background: #fff; color: var(--navy); }

    .container { max-width: 1050px; margin: 24px auto; padding: 0 16px; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 6px 20px rgba(8, 41, 84, 0.06);
    }
    .login-box { max-width: 380px; margin: 40px auto; text-align: center; }
    .login-box h2 { color: var(--navy); margin-bottom: 8px; }
    .login-box p { font-size: 13px; color: #52607a; margin-bottom: 16px; }
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      letter-spacing: 6px;
      margin-bottom: 12px;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-navy { background: var(--navy); color: #fff; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .err { color: var(--red); font-size: 13px; font-weight: 600; margin-top: 8px; min-height: 18px; }

    #dashboard { display: none; }
    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .dash-top h2 { color: var(--navy); font-size: 20px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 11px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { background: #eef4fc; color: var(--navy); font-weight: 800; }
    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .tag-pending { background: #fff4e5; color: #9a5b00; }
    .tag-done { background: #e8f8ee; color: #146c38; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand-link" href="index.html">
      <svg width="22" height="22" viewBox="0 0 48 48" fill="none">
        <path d="M24 4L5 19v23a3 3 0 0 0 3 3h32a3 3 0 0 0 3-3V19L24 4z" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M24 38.5s-10-6.4-10-13.2a6.2 6.2 0 0 1 10-4.9 6.2 6.2 0 0 1 10 4.9c0 6.8-10 13.2-10 13.2z" fill="#d91c24"/>
      </svg>
      KAPOOR HOME CARE &bull; ADMIN
    </a>
    <div class="mode-switch">
      <a class="mode-btn" href="index.html">Public Site</a>
      <a class="mode-btn active" href="admin.html">Admin Panel</a>
    </div>
  </div>

  <div class="container">
    <div class="card login-box" id="loginCard">
      <h2>Admin Login</h2>
      <p>Enter 4-digit PIN to view bookings (Faridabad &bull; 6397053265)</p>
      <input type="password" id="pinInput" maxlength="4" placeholder="••••" />
      <button class="btn btn-navy" style="width:100%;" onclick="verifyPin()">Unlock Admin Panel</button>
      <div class="err" id="pinError"></div>
    </div>

    <div class="card" id="dashboard">
      <div class="dash-top">
        <h2>Bookings Desk (<span id="bookingCount">0</span>)</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-navy btn-sm" onclick="renderBookings()">Refresh</button>
          <button class="btn btn-red btn-sm" onclick="clearAll()">Clear All</button>
          <button class="btn btn-sm" style="background:#e2e8f0;" onclick="lockPanel()">Lock</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Patient</th>
              <th>Phone</th>
              <th>Service</th>
              <th>Locality</th>
              <th>Time</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="bookingsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PIN = "1234";
    const STORAGE_KEY = "kapoorHomeCareBookings";

    function verifyPin() {
      const val = document.getElementById("pinInput").value.trim();
      if (val === ADMIN_PIN) {
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        renderBookings();
      } else {
        document.getElementById("pinError").textContent = "Invalid PIN. Please try again.";
      }
    }

    document.getElementById("pinInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") verifyPin();
    });

    function lockPanel() {
      document.getElementById("pinInput").value = "";
      document.getElementById("pinError").textContent = "";
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginCard").style.display = "block";
    }

    function getList() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function renderBookings() {
      const list = getList();
      const tbody = document.getElementById("bookingsBody");
      document.getElementById("bookingCount").textContent = list.length;

      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:#64748b;padding:20px;">No bookings found in local storage on this browser.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map((b, idx) => `
        <tr>
          <td><strong>${b.id || "-"}</strong></td>
          <td>${b.patientName || "-"}</td>
          <td><a href="tel:${b.phone || ""}">${b.phone || "-"}</a></td>
          <td>${b.service || "-"}</td>
          <td>${b.locality || "-"}</td>
          <td>${b.createdAt || "-"}</td>
          <td>
            <span class="tag ${b.status === "Confirmed" ? "tag-done" : "tag-pending"}">
              ${b.status || "Pending"}
            </span>
          </td>
          <td style="white-space:nowrap;">
            <button class="btn btn-green btn-sm" onclick="toggleStatus(${idx})">Confirm</button>
            <button class="btn btn-red btn-sm" onclick="deleteBooking(${idx})">Delete</button>
          </td>
        </tr>
      `).join("");
    }

    function toggleStatus(idx) {
      const list = getList();
      if (!list[idx]) return;
      list[idx].status = list[idx].status === "Confirmed" ? "Pending" : "Confirmed";
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      renderBookings();
    }

    function deleteBooking(idx) {
      const list = getList();
      list.splice(idx, 1);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      renderBookings();
    }

    function clearAll() {
      if (!confirm("Delete all stored bookings on this browser?")) return;
      localStorage.removeItem(STORAGE_KEY);
      renderBookings();
    }
  </script>

<div id="khcAdminExtras" style="max-width:960px;margin:28px auto;padding:20px;border:1px solid #cbd5e1;border-radius:10px;background:#ffffff;font-family:Arial,sans-serif;">
  <h3 style="margin-top:0;color:#0f294a;">Complaints Received</h3>
  <div id="adminComplaintsList"></div>

  <h3 style="margin-top:24px;color:#0f294a;">Website Ratings &amp; Feedback</h3>
  <div id="adminRatingsSummary" style="font-weight:600;margin-bottom:10px;"></div>
  <div id="adminRatingsList"></div>
</div>

<script>
(function() {
  const C_KEY = "khc_complaints_v1";
  const R_KEY = "khc_ratings_v1";

  function readList(k) {
    try {
      const d = JSON.parse(localStorage.getItem(k) || "[]");
      return Array.isArray(d) ? d : [];
    } catch (e) {
      return [];
    }
  }

  function writeList(k, v) {
    localStorage.setItem(k, JSON.stringify(v));
  }

  function esc(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  window.khcRenderAdminExtras = function() {
    const cBox = document.getElementById("adminComplaintsList");
    const rSum = document.getElementById("adminRatingsSummary");
    const rBox = document.getElementById("adminRatingsList");
    if (!cBox || !rSum || !rBox) return;

    const complaints = readList(C_KEY);
    if (!complaints.length) {
      cBox.innerHTML = "<p>Abhi koi complaint darj nahi hai.</p>";
    } else {
      cBox.innerHTML = complaints.map(c => `
        <div style="border:1px solid #cbd5e1;border-radius:8px;padding:12px;margin-bottom:10px;background:#f8fafc;">
          <strong>${esc(c.id)}</strong> — <strong>${esc(c.name)}</strong> (${esc(c.phone)})
          <div style="font-size:13px;margin-top:4px;"><em>Category:</em> ${esc(c.category)} | <em>Status:</em> <strong>${esc(c.status)}</strong> | <em>Date:</em> ${esc(c.createdAt)}</div>
          <p style="margin:8px 0;">${esc(c.details)}</p>
          <button type="button" onclick="khcToggleComplaint('${esc(c.id)}')">Mark ${c.status === "Open" ? "Resolved" : "Open"}</button>
          <button type="button" onclick="khcDeleteComplaint('${esc(c.id)}')" style="margin-left:8px;">Delete</button>
        </div>
      `).join("");
    }

    const ratings = readList(R_KEY);
    if (!ratings.length) {
      rSum.textContent = "Average Rating: 0.0 / 5 (0 ratings)";
      rBox.innerHTML = "<p>Abhi koi rating nahi aayi hai.</p>";
    } else {
      const avg = ratings.reduce((s, r) => s + Number(r.stars || 0), 0) / ratings.length;
      rSum.textContent = `Average Rating: ${avg.toFixed(1)} / 5 (${ratings.length} ratings)`;
      rBox.innerHTML = ratings.map(r => `
        <div style="border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:8px;background:#f8fafc;">
          <strong>${"★".repeat(Number(r.stars || 0))}</strong> (${esc(r.stars)}/5) — <small>${esc(r.createdAt)}</small>
          <div>${esc(r.note || "No written note")}</div>
        </div>
      `).join("");
    }
  };

  window.khcToggleComplaint = function(id) {
    const list = readList(C_KEY).map(item =>
      item.id === id ? { ...item, status: item.status === "Open" ? "Resolved" : "Open" } : item
    );
    writeList(C_KEY, list);
    window.khcRenderAdminExtras();
  };

  window.khcDeleteComplaint = function(id) {
    const list = readList(C_KEY).filter(item => item.id !== id);
    writeList(C_KEY, list);
    window.khcRenderAdminExtras();
  };

  window.khcRenderAdminExtras();
})();
</script>

</body>
</html>
